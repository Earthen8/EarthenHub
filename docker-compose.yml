services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=earthenhub
      - POSTGRES_USER=earthen
      - POSTGRES_PASSWORD=your_secure_password
    restart: always

  backend:
    build: ./backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://earthen:your_secure_password@db:5432/earthenhub
      - SECRET_KEY=your_production_secret_key
      - DEBUG=False
      - ALLOWED_HOSTS=earthen.my.id,backend,localhost
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://earthen.my.id/api
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume: